<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JaxCards</title>
<meta name="theme-color" content="#10131A" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{
    --bg:#10131A;
    --surface:#171B24;
    --surface-2:#1E2330;
    --line:#2A3040;
    --accent:#5E5CE6;
    --accent-dim:#403d99;
    --accent-deep:#2b1f5c;
    --text:#EDEFF3;
    --muted:#8B93A3;
    --danger:#E2574C;
    --radius-card: 16px;
    --radius-sheet: 22px;
    /* Safari's bottom toolbar shows/hides unpredictably and isn't
       reliably detectable (visualViewport can't see it either — see
       jaxmoney's notes). Rather than chase it, just always leave this
       much dead space at the very bottom so nothing tappable can ever
       end up under it. */
    --bottom-safe: calc(64px + env(safe-area-inset-bottom));
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html{ touch-action: manipulation; -webkit-text-size-adjust:100%; background:var(--bg); }
  html, body{ height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; }
  body{
    margin:0;
    background-color: var(--bg);
    background-image:
      radial-gradient(1200px 600px at 50% -10%, #1a1f2b 0%, var(--bg) 55%);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  button, .btn, .card-thumb, .icon-btn, .link{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  input, textarea{ user-select:text; font-size:16px; } /* 16px stops iOS auto-zooming the page on focus */
  #app{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display:flex; flex-direction:column;
    position:relative;
  }
  /* Wider viewports (tablet / desktop browser): let the shell breathe
     instead of staying pinned to a phone-width column. */
  @media (min-width: 640px){
    #app{ max-width:720px; }
    .sheet-backdrop .sheet{ max-width:480px; }
  }
  .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- Screens ---------- */
  /* overflow-y:auto is a safety net for very short screens (a screen's
     content should normally fit without scrolling, but if it doesn't,
     it scrolls internally — never the whole page). */
  .screen{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; padding:28px 22px; position:relative; }
  .hidden{ display:none !important; }

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 20px; border-radius:14px; border:none; font-size:16px; font-weight:600;
    background:var(--surface-2); color:var(--text); border:1px solid var(--line);
  }
  .btn.primary{ background:linear-gradient(135deg, var(--accent), #4a48b8); color:#fff; border:none; }
  .btn.danger{ color:var(--danger); border-color: rgba(226,87,76,.4); }
  .btn.danger.confirming{ background:var(--danger); color:#fff; border-color:var(--danger); }
  .btn.block{ width:100%; }
  .btn:active{ opacity:.85; }
  .btn:disabled{ opacity:.4; }
  .link{ background:none; border:none; color:var(--accent); font-size:14.5px; text-align:center; padding:12px; }

  .field{ margin-bottom:9px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:.02em; }
  .field input, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 13px; color:var(--text); font-size:16px;
  }
  .field textarea{ min-height:52px; resize:vertical; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field-error{ color:var(--danger); font-size:11.5px; margin-top:3px; min-height:12px; }
  .field input.invalid{ border-color:var(--danger); }

  /* ---------- Vault list ---------- */
  #vault-screen{
    padding-bottom:calc(72px + var(--bottom-safe));
    overflow:hidden; /* only #card-list inside scrolls, not this wrapper */
    display:flex; flex-direction:column;
  }
  #vault-screen .topbar, #vault-screen .banner{ flex:none; }
  #vault-screen #empty-state{ flex:none; }
  #vault-screen #card-list{ flex:1 1 auto; min-height:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .topbar h1{ font-size:17px; font-weight:700; letter-spacing:-0.2px; color:var(--accent); margin:0; }
  .topbar .version{ font-size:12px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
  .icon-btn{ width:38px;height:38px;border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:16px; }

  .empty{ text-align:center; margin-top:60px; color:var(--muted); }
  .empty .mark{ width:52px;height:36px;border-radius:8px; margin:0 auto 18px; background:linear-gradient(135deg, var(--surface-2), var(--surface)); border:1px solid var(--line); }

  /* Thumbnail picker grid — this is the whole point of the list screen:
     recognize a card by its face, tap it, then see details. Column count
     grows with viewport width so it also works on a tablet/desktop window. */
  .card-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    align-content:start;
    gap:14px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:8px;
  }
  .card-thumb{
    position:relative; border-radius:var(--radius-card); aspect-ratio:1.586/1; overflow:hidden;
    border:1px solid rgba(255,255,255,.08); box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .card-thumb.no-photo{ background:linear-gradient(135deg, rgba(94,92,230,.38), rgba(94,92,230,.12)); }
  .card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-thumb .placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .card-thumb .placeholder .brand-mark{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; font-weight:700; color:#fff; }
  .card-thumb .caption{
    position:absolute; left:0; right:0; bottom:0; padding:8px 10px 7px;
    background:linear-gradient(0deg, rgba(0,0,0,.65), rgba(0,0,0,0));
    font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .fab{
    position:fixed; left:50%; bottom:var(--bottom-safe); transform:translateX(-50%);
    width:calc(100% - 44px); max-width:436px;
  }
  @media (min-width: 640px){ .fab{ max-width:520px; } }

  /* ---------- Sheet / modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(6,7,10,.6); display:flex; align-items:flex-end; z-index:50;
  }
  .sheet{
    width:100%; max-width:480px; margin:0 auto; background:var(--surface);
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    padding:10px 22px calc(24px + var(--bottom-safe));
    max-height:88vh; overflow:hidden;
    border-top:1px solid var(--line);
  }
  .sheet .grabber{ width:38px;height:4px;background:var(--line); border-radius:2px; margin:8px auto 12px; }
  .sheet h2{ font-size:19px; margin:4px 0 12px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn{ flex:1; }

  .detail-card{
    border-radius:18px; padding:22px; margin-bottom:20px; position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(150deg, #4b3fb0 0%, var(--accent-deep) 70%);
    color:#fff;
  }
  .detail-card .nickname{ font-size:16px; font-weight:700; color:#fff; }
  .detail-card .bank{ font-size:12.5px; opacity:.75; margin-top:2px; color:#fff; }
  .detail-card .numberline{ font-size:17px; margin-top:26px; letter-spacing:.03em; display:flex; align-items:center; justify-content:space-between; gap:10px; white-space:nowrap; color:#fff; }
  .detail-card .copy-btn{ background:rgba(255,255,255,.18); border:none; color:#fff; padding:0; border-radius:9px; flex:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .detail-row{ display:flex; justify-content:space-between; font-size:13px; margin-top:18px; opacity:.85; }
  .note-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:14px; margin-top:6px; white-space:pre-wrap; }
  .copy-hint{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:6px; }

  .photo-preview{ width:100%; height:110px; border-radius:12px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; overflow:hidden; margin-bottom:10px; background:var(--surface); }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:#222633; border:1px solid var(--line); color:var(--text); font-size:13.5px;
    padding:10px 18px; border-radius:12px; z-index:99; opacity:0; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .banner{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:18px;
  }
  .banner b{ color:var(--text); }
</style>
</head>
<body>
<div id="app">

  <!-- VAULT (main) -->
  <section id="vault-screen" class="screen hidden">
    <div class="topbar">
      <h1>JaxCards</h1>
      <span class="version">V1.0.0</span>
    </div>
    <div class="banner"><b>離線運作</b> · 所有資料加密存在本機 IndexedDB,這個 App 不會連線到任何伺服器。</div>
    <div id="empty-state" class="empty hidden">
      <div class="mark"></div>
      還沒有任何卡片<br/>點下面的按鈕開始新增
    </div>
    <div id="card-list" class="card-grid"></div>
    <button class="btn primary fab" id="add-card-btn">＋ 新增卡片</button>
  </section>

</div>

<div id="toast" class="toast"></div>

<!-- Card detail sheet -->
<div id="detail-backdrop" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="grabber"></div>
    <div id="detail-content"></div>
    <div class="sheet-actions">
      <button class="btn" id="detail-edit-btn">編輯</button>
      <button class="btn danger" id="detail-delete-btn">刪除</button>
    </div>
  </div>
</div>

<!-- Add / edit sheet -->
<div id="form-backdrop" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="grabber"></div>
    <h2 id="form-title">新增卡片</h2>
    <div class="photo-preview" id="photo-preview">尚未選擇卡面縮圖(選填)</div>
    <input type="file" accept="image/*" id="photo-input" class="hidden" />
    <div class="field"><label>卡片暱稱</label><input id="f-nickname" placeholder="例如：國泰無限卡" /></div>
    <div class="field">
      <label>卡號</label>
      <input id="f-number" class="mono" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" />
      <div class="field-error" id="f-number-error"></div>
    </div>
    <div class="field">
      <label>有效期限</label>
      <input id="f-expiry" class="mono" inputmode="numeric" maxlength="5" placeholder="MM/YY" />
      <div class="field-error" id="f-expiry-error"></div>
    </div>
    <div class="field"><label>備註(可放你自己的 CVV 密碼提示)</label><textarea id="f-note" placeholder="例如：自訂密碼規則,只有你看得懂"></textarea></div>
    <div class="sheet-actions">
      <button class="btn" id="form-cancel-btn">取消</button>
      <button class="btn primary" id="form-save-btn">儲存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
