<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JaxCards</title>
<meta name="theme-color" content="#10131A" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{
    --bg:#10131A;
    --surface:#171B24;
    --surface-2:#1E2330;
    --line:#2A3040;
    --accent:#5E5CE6;
    --accent-dim:#403d99;
    --accent-deep:#2b1f5c;
    --text:#EDEFF3;
    --muted:#8B93A3;
    --danger:#E2574C;
    --radius-card: 16px;
    --radius-sheet: 22px;
    /* Safari's bottom toolbar shows/hides unpredictably and isn't
       reliably detectable (visualViewport can't see it either — see
       jaxmoney's notes). Rather than chase it, just always leave this
       much dead space at the very bottom so nothing tappable can ever
       end up under it. */
    --bottom-safe: calc(64px + env(safe-area-inset-bottom));
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html{ touch-action: manipulation; -webkit-text-size-adjust:100%; background:var(--bg); }
  html, body{ height:100%; height:100dvh; overflow:hidden; overscroll-behavior:none; }
  body{
    margin:0;
    background-color: var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  button, .btn, .card-thumb, .icon-btn, .link{ touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  input, textarea{ user-select:text; font-size:16px; } /* 16px stops iOS auto-zooming the page on focus */

  /* ---------- Shell, adapted from JaxMoney's proven .board-header/.canvas-wrap pattern ----------
     .board-header: fixed, native size, never scaled — always crisp.
     #app (= JaxMoney's .canvas-wrap): fixed, top set by JS to sit right
     below the header (header.offsetHeight), sized off trustedViewportHeight
     instead of CSS dvh — this is what actually solves the dvh-misreporting
     bug. #app-canvas is a plain, unscaled, full-width column (JaxMoney's
     own transform:scale() was dropped here: it shrinks width along with
     height, which made the whole card column look too narrow). #card-list
     inside it gets its height set directly by JS (sizeCardList) to exactly
     fill the remaining space instead. */
  .board-header{
    position:fixed; top:0; left:0; right:0; z-index:20;
    padding: calc(10px + env(safe-area-inset-top)) 22px 8px;
    display:flex; align-items:baseline; justify-content:space-between;
    background: var(--bg);
    max-width:480px; margin:0 auto;
  }
  .board-header h1{ font-size:17px; font-weight:700; letter-spacing:-0.2px; color:var(--accent); margin:0; }
  .board-header .version{ font-size:12px; color:var(--muted); font-weight:600; font-variant-numeric:tabular-nums; }
  #app{
    position:fixed;
    top: var(--header-height, 0px);
    left:0; right:0; bottom:0;
    display:flex; align-items:flex-start; justify-content:center;
    overflow:hidden;
  }
  #app-canvas{
    width:100%; max-width:480px;
    display:flex; flex-direction:column;
    background: var(--bg);
  }
  @media (min-width: 640px){
    .board-header{ max-width:720px; }
    #app-canvas{ max-width:720px; }
    .sheet-backdrop .sheet{ max-width:480px; }
  }
  .mono{ font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- Screens ---------- */
  .screen{ display:flex; flex-direction:column; padding:0 22px 22px; position:relative; }
  .hidden{ display:none !important; }

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 20px; border-radius:14px; border:none; font-size:16px; font-weight:600;
    background:var(--surface-2); color:var(--text); border:1px solid var(--line);
  }
  .btn.primary{ background:linear-gradient(135deg, var(--accent), #4a48b8); color:#fff; border:none; }
  .btn.danger{ color:var(--danger); border-color: rgba(226,87,76,.4); }
  .btn.danger.confirming{ background:var(--danger); color:#fff; border-color:var(--danger); }
  .btn.block{ width:100%; }
  .btn:active{ opacity:.85; }
  .btn:disabled{ opacity:.4; }
  .link{ background:none; border:none; color:var(--accent); font-size:14.5px; text-align:center; padding:12px; }

  .field{ margin-bottom:9px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; letter-spacing:.02em; }
  .field input, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 13px; color:var(--text); font-size:16px;
  }
  .field textarea{ min-height:52px; resize:vertical; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field-error{ color:var(--danger); font-size:11.5px; margin-top:3px; min-height:12px; }
  .field input.invalid{ border-color:var(--danger); }

  /* ---------- Vault list ---------- */
  #vault-screen{
    display:flex; flex-direction:column;
    padding-top:14px;
    position:relative;
  }
  #icon-row{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px; position:relative; }
  .icon-btn.wide{ flex:0 0 auto; width:96px; border-radius:19px; position:absolute; top:0; left:50%; transform:translateX(-50%); }
  /* Soft fade over #card-list's bottom edge so its cutoff isn't a hard
     line — purely decorative, sits on top of the scrollable list. */
  .card-list-fade{
    position:absolute; left:22px; right:22px; bottom:22px;
    height:64px;
    background: linear-gradient(to top, var(--bg) 0%, var(--bg) 35%, rgba(16,19,26,0) 100%);
    pointer-events:none;
    z-index:2;
  }
  .icon-btn{ width:38px;height:38px;border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:16px; display:flex; align-items:center; justify-content:center; }
  .icon-btn.primary{ background:linear-gradient(135deg, var(--accent), #3D5AFE); border:none; color:#fff; }

  .empty{ text-align:center; margin-top:60px; color:var(--muted); }
  .empty .mark{ width:52px;height:36px;border-radius:8px; margin:0 auto 18px; background:linear-gradient(135deg, var(--surface-2), var(--surface)); border:1px solid var(--line); }

  /* Card list — all cards render full-width in a single overlapping stack
     (Apple Wallet-style). Previously split into a stack (top 3) + 2-column
     grid (rest), but having two different card styles felt inconsistent,
     so it's back to one uniform stack for every card. */
  #card-list{
    /* Height is set directly by JS (sizeCardList) to exactly fill the
       real remaining space below the icon row — no scaling involved, so
       width is never affected. This CSS height is just a sensible
       fallback before JS runs on first paint. */
    height: 500px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column;
  }
  .card-stack{ display:flex; flex-direction:column; }
  .card-stack .card-thumb{ width:100%; }
  .card-stack .card-thumb:not(:first-child){ margin-top:-30px; }
  .card-thumb{
    position:relative; border-radius:var(--radius-card); aspect-ratio:1.586/1; overflow:hidden;
    border:1px solid rgba(255,255,255,.08); box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .card-thumb.no-photo{ background:linear-gradient(135deg, rgba(94,92,230,.38), rgba(94,92,230,.12)); }
  .card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-thumb .placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:10px; }
  .card-thumb .placeholder .name-mark{
    font-size:16px; font-weight:700; color:#fff; text-align:center; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ---------- Sheet / modal ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(6,7,10,.6); display:flex; align-items:flex-end; z-index:50;
  }
  .sheet{
    width:100%; max-width:480px; margin:0 auto; background:var(--surface);
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    padding:10px 22px calc(24px + var(--bottom-safe));
    max-height:88vh; overflow:hidden;
    border-top:1px solid var(--line);
  }
  .sheet .grabber{ width:38px;height:4px;background:var(--line); border-radius:2px; margin:8px auto 12px; }
  .sheet h2{ font-size:19px; margin:4px 0 12px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn{ flex:1; }

  .detail-card{
    border-radius:18px; padding:22px; margin-bottom:20px; position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    background:linear-gradient(150deg, #4b3fb0 0%, var(--accent-deep) 70%);
    color:#fff;
  }
  .detail-card .nickname{ font-size:16px; font-weight:700; color:#fff; }
  .detail-card .numberline{ font-size:17px; margin-top:26px; letter-spacing:.03em; display:flex; align-items:center; justify-content:space-between; gap:10px; white-space:nowrap; color:#fff; }
  .detail-card .copy-btn{ background:rgba(255,255,255,.18); border:none; color:#fff; padding:0; border-radius:9px; flex:none; width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .detail-row{ display:flex; justify-content:space-between; font-size:13px; margin-top:18px; opacity:.85; }
  .note-box{ font-size:14px; margin-top:6px; white-space:pre-wrap; color:var(--text); opacity:.9; }
  .copy-hint{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:6px; }

  .photo-preview{ height:110px; width:calc(110px * 1.586); max-width:100%; margin:0 auto 10px; border-radius:12px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; overflow:hidden; background:var(--surface); }
  .photo-preview img{ width:100%; height:100%; object-fit:cover; }

  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:#222633; border:1px solid var(--line); color:var(--text); font-size:13.5px;
    padding:10px 18px; border-radius:12px; z-index:99; opacity:0; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .banner{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:12.5px; color:var(--muted); line-height:1.5; margin-bottom:18px;
  }
  .banner b{ color:var(--text); }

  /* ---------- Photo crop screen ---------- */
  .crop-screen{
    position:fixed; inset:0; background:#000; z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .crop-topbar{
    position:absolute; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
  }
  .crop-topbar .crop-title{ color:#fff; font-size:14px; font-weight:600; }
  .crop-topbar .link{ color:var(--accent); font-size:15px; padding:6px 4px; }
  .crop-viewport{
    position:relative; overflow:hidden; border-radius:14px; touch-action:none;
    background:#111; border:1px solid rgba(255,255,255,.15);
  }
  .crop-viewport img{
    position:absolute; top:0; left:0; transform-origin:0 0;
    will-change:transform; user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  .crop-hint{
    position:absolute; bottom:calc(24px + env(safe-area-inset-bottom));
    left:0; right:0; text-align:center; color:var(--muted); font-size:12px;
  }

  /* ---------- Reorder screen ---------- */
  .reorder-screen{
    position:fixed; inset:0; background:var(--bg); z-index:60;
    display:flex; flex-direction:column;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .reorder-topbar{
    display:flex; align-items:center; justify-content:space-between; flex:none;
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
  }
  .reorder-topbar .link{ font-size:15px; padding:6px 4px; }
  .reorder-topbar .reorder-title{ font-size:14px; font-weight:600; color:var(--text); }
  .reorder-list{
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:0 18px calc(18px + var(--bottom-safe));
  }
  .reorder-row{
    display:flex; align-items:center; gap:12px; padding:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    margin-bottom:8px; position:relative;
  }
  .reorder-row.dragging{ z-index:5; box-shadow:0 10px 24px rgba(0,0,0,.45); }
  .reorder-row .reorder-thumb{
    width:42px; height:calc(42px / 1.586); border-radius:6px; overflow:hidden; flex:none;
    background:linear-gradient(135deg, rgba(94,92,230,.38), rgba(94,92,230,.12));
    display:flex; align-items:center; justify-content:center;
  }
  .reorder-row .reorder-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .reorder-row .reorder-name{ flex:1; font-size:14.5px; }
  .reorder-row .drag-handle{
    color:var(--muted); touch-action:none; cursor:grab;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center; flex:none; margin:-8px;
  }
</style>
</head>
<body>
<div class="board-header" id="boardHeader">
  <h1>JaxCards</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="version">V2.5.0</span>
    <button class="icon-btn" id="backup-btn" aria-label="備份與還原">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>
</div>

<div id="app">
<div id="app-canvas">

  <!-- VAULT (main) -->
  <section id="vault-screen" class="screen hidden">
    <div id="icon-row">
      <button class="icon-btn" id="reorder-btn" aria-label="調整卡片順序">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>
      <button class="icon-btn primary wide" id="add-card-btn" aria-label="新增卡片">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    <div id="empty-state" class="empty hidden">
      <div class="mark"></div>
      還沒有任何卡片<br/>點上面的按鈕開始新增
    </div>
    <div id="card-list">
      <div class="card-stack" id="card-stack"></div>
    </div>
    <div class="card-list-fade"></div>
  </section>

</div>
</div>

<div id="toast" class="toast"></div>

<!-- Card detail sheet -->
<div id="detail-backdrop" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="grabber"></div>
    <div id="detail-content"></div>
    <div class="sheet-actions">
      <button class="btn" id="detail-edit-btn">編輯</button>
      <button class="btn danger" id="detail-delete-btn">刪除</button>
    </div>
  </div>
</div>

<!-- Add / edit sheet -->
<div id="form-backdrop" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="grabber"></div>
    <h2 id="form-title">新增卡片</h2>
    <div class="photo-preview" id="photo-preview">尚未選擇卡面縮圖(選填)</div>
    <input type="file" accept="image/*" id="photo-input" class="hidden" />
    <div class="field"><label>卡片暱稱</label><input id="f-nickname" placeholder="台銀Visa卡" /></div>
    <div class="field">
      <label>卡號</label>
      <input id="f-number" class="mono" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" />
      <div class="field-error" id="f-number-error"></div>
    </div>
    <div class="field">
      <label>有效期限</label>
      <input id="f-expiry" class="mono" inputmode="numeric" maxlength="5" placeholder="MM/YY" />
      <div class="field-error" id="f-expiry-error"></div>
    </div>
    <div class="field">
      <label>CVV 🔒</label>
      <input id="f-cvv" class="mono" inputmode="numeric" maxlength="4" />
    </div>
    <div class="field"><label>備註</label><textarea id="f-note"></textarea></div>
    <div class="sheet-actions">
      <button class="btn" id="form-cancel-btn">取消</button>
      <button class="btn primary" id="form-save-btn">儲存</button>
    </div>
  </div>
</div>

<!-- Backup / restore sheet -->
<div id="backup-backdrop" class="sheet-backdrop hidden">
  <div class="sheet">
    <div class="grabber"></div>

    <div id="backup-main">
      <h2>備份與還原</h2>
      <div class="banner">
        匯出的檔案會用你設定的密碼加密。<b>請記住這組密碼</b>——之後要在別的裝置匯入時需要輸入,忘記密碼的話這份備份檔就沒辦法還原了。
      </div>
      <button class="btn block" id="export-btn" style="margin-bottom:10px;">匯出資料成檔案</button>
      <button class="btn block" id="import-btn">從檔案匯入</button>
      <input type="file" accept="application/json" id="import-input" class="hidden" />
      <button class="link" id="backup-close-btn">關閉</button>
    </div>

    <div id="backup-export-step" class="hidden">
      <h2>設定備份密碼</h2>
      <div class="field"><label>密碼(至少 6 碼)</label><input type="password" id="export-pw" /></div>
      <div class="field"><label>再輸入一次</label><input type="password" id="export-pw-confirm" /></div>
      <div class="field-error" id="export-pw-error"></div>
      <div class="sheet-actions">
        <button class="btn" id="export-pw-cancel">取消</button>
        <button class="btn primary" id="export-pw-confirm-btn">匯出</button>
      </div>
    </div>

    <div id="backup-import-step" class="hidden">
      <h2>輸入備份密碼</h2>
      <div class="field"><label>密碼</label><input type="password" id="import-pw" /></div>
      <div class="field-error" id="import-pw-error"></div>
      <div class="sheet-actions">
        <button class="btn" id="import-pw-cancel">取消</button>
        <button class="btn primary" id="import-pw-confirm-btn">匯入</button>
      </div>
    </div>

  </div>
</div>

<!-- Photo crop screen -->
<div id="crop-backdrop" class="crop-screen hidden">
  <div class="crop-topbar">
    <button class="link" id="crop-cancel-btn">取消</button>
    <span class="crop-title">調整卡面範圍</span>
    <button class="link" id="crop-done-btn">完成</button>
  </div>
  <div class="crop-viewport" id="crop-viewport">
    <img id="crop-img" draggable="false" alt="" />
  </div>
  <button class="icon-btn" id="crop-rotate-btn" style="margin-top:16px;" aria-label="旋轉">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6"/>
      <path d="M2.5 22v-6h6"/>
      <path d="M2 11.5a10 10 0 0 1 17.4-6.7L21.5 8"/>
      <path d="M22 12.5a10 10 0 0 1-17.4 6.7L2.5 16"/>
    </svg>
  </button>
  <div class="crop-hint">拖曳移動 · 兩指縮放</div>
</div>

<!-- Reorder screen -->
<div id="reorder-backdrop" class="reorder-screen hidden">
  <div class="reorder-topbar">
    <button class="link" id="reorder-cancel-btn">取消</button>
    <span class="reorder-title">調整卡片順序</span>
    <button class="link" id="reorder-done-btn">完成</button>
  </div>
  <div class="reorder-list" id="reorder-list"></div>
</div>

<script src="app.js"></script>
</body>
</html>
